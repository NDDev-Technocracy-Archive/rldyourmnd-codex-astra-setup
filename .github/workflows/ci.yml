name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-24.04
      tools: shellcheck@0.11.0
      fetch-depth: 0

  gate:
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require the complete shared source check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'map_values(.result) == {"check":"success"}' <<< "$NEEDS"
